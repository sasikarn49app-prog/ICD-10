<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICD-10 Grand Reference Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b1324;
      --bg-glow: #162647;
      --paper: #ffffff;
      --paper-sub: #f8fafc;
      --ink: #0f172a;
      --ink-sub: #475569;
      --navy: #0f294a;
      --navy-soft: #eff6ff;
      --gold: #9a5b13;
      --gold-bright: #c88a2b;
      --gold-light: #fef3c7;
      --rule: #e2e8f0;
      --rule-dark: #0f294a;
      --code-bg: #0f294a;
      --code-fg: #ffffff;
      --sub-bg: #334155;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top center, rgba(200, 138, 43, 0.14), transparent 45%),
        linear-gradient(180deg, var(--bg-main) 0%, var(--bg-glow) 280px, #09101f 100%);
      min-height: 100vh;
      color: var(--ink);
      font-family: 'IBM Plex Sans Thai', -apple-system, sans-serif;
      line-height: 1.55;
    }

    .app-wrap {
      max-width: 1040px;
      margin: 24px auto 56px;
      padding: 0 14px;
    }

    .atlas-frame {
      background: var(--paper);
      border: 1px solid #cbd5e1;
      outline: 3px double rgba(154, 91, 19, 0.45);
      outline-offset: -7px;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.42);
      padding: 28px 24px;
    }

    .atlas-header {
      border-bottom: 2px solid var(--rule-dark);
      padding-bottom: 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }

    .atlas-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .atlas-title {
      font-family: 'Cinzel', 'IBM Plex Sans Thai', serif;
      font-size: 1.65rem;
      margin: 0;
      color: var(--navy);
      letter-spacing: 0.04em;
      line-height: 1.25;
    }

    .atlas-sub {
      margin: 5px 0 0;
      font-size: 0.9rem;
      color: var(--ink-sub);
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--navy);
      background: var(--paper-sub);
      border: 1px solid #cbd5e1;
      border-left: 3px solid var(--gold-bright);
      padding: 6px 12px;
      border-radius: 3px;
    }

    .mode-switch-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      background: #eef2f6;
      border: 1px solid #cbd5e1;
      padding: 5px;
      border-radius: 6px;
    }

    .btn-mode {
      flex: 1;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-sub);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.18s ease;
    }

    .btn-mode:hover {
      color: var(--navy);
      background: rgba(255, 255, 255, 0.55);
    }

    .btn-mode.active {
      background: var(--navy);
      color: #ffffff;
      border-color: var(--navy);
      box-shadow: 0 3px 10px rgba(15, 41, 74, 0.22);
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1.6fr 1fr auto;
      gap: 10px;
      background: var(--paper-sub);
      border: 1px solid var(--rule);
      border-top: 2px solid var(--gold-bright);
      padding: 12px;
      margin-bottom: 18px;
      align-items: center;
    }

    @media (max-width: 720px) {
      .control-panel { grid-template-columns: 1fr; }
      .atlas-frame { padding: 20px 14px; }
    }

    input[type="search"], select {
      width: 100%;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    input[type="search"]:focus, select:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(15, 41, 74, 0.12);
    }

    .btn-reset {
      padding: 9px 14px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-reset:hover {
      background: var(--gold-light);
      border-color: var(--gold-bright);
    }

    .row-item {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      padding: 13px 4px;
      border-bottom: 1px solid var(--rule);
      align-items: start;
    }

    .row-item.is-header {
      background: linear-gradient(90deg, rgba(15, 41, 74, 0.04) 0%, rgba(200, 138, 43, 0.06) 100%);
      border-top: 1px solid #cbd5e1;
      border-bottom: 1.5px solid var(--navy);
      margin-top: 6px;
      padding: 14px 8px;
    }

    @media (max-width: 560px) {
      .row-item { grid-template-columns: 88px 1fr; gap: 10px; }
    }

    .code-btn {
      display: inline-block;
      min-width: 76px;
      background: var(--code-bg);
      color: var(--code-fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 4px 8px;
      border: 1px solid rgba(200, 138, 43, 0.45);
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .code-btn:hover {
      background: #1a3d6b;
      transform: translateY(-1px);
    }

    .code-btn.sub {
      background: var(--sub-bg);
      border-color: transparent;
    }

    .code-btn.sub:hover {
      background: #1e293b;
    }

    .term-title {
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--ink);
    }

    .row-item.is-header .term-title {
      font-size: 1.02rem;
      color: var(--navy);
    }

    .term-sub {
      font-size: 0.88rem;
      color: #334155;
      margin-top: 3px;
    }

    .note-box {
      font-size: 0.83rem;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 3px solid var(--gold-bright);
      padding: 6px 10px;
      margin-top: 6px;
      border-radius: 0 3px 3px 0;
    }

    .error-box {
      font-size: 0.88rem;
      color: #7f1d1d;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      padding: 12px 14px;
      border-radius: 4px;
      margin-top: 10px;
    }

    .flag-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      background: var(--gold-light);
      color: var(--gold);
      border: 1px solid rgba(200, 138, 43, 0.45);
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 3px;
      margin-top: 5px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--navy);
      color: #ffffff;
      border: 1px solid var(--gold-bright);
      padding: 9px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: none;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="atlas-frame">
      <header class="atlas-header">
        <div>
          <div class="atlas-kicker">WHO ICD-10 · Grand Reference Atlas</div>
          <h1 class="atlas-title">ICD-10 Clinical Reference Atlas</h1>
          <p class="atlas-sub">ดัชนี Volume 3 และคู่มือ Tabular List (A00–Z99) · คลิกที่รหัสเพื่อคัดลอกทันที</p>
        </div>
        <div id="statusText" class="status-pill">กำลังโหลด...</div>
      </header>

      <div class="mode-switch-bar" role="tablist" aria-label="เลือกโหมดการแสดงผล">
        <button id="btnVol3" type="button" class="btn-mode" onclick="switchMode('VOL3')">
          Volume 3 Index (ค้นหาจากคลัง JSON)
        </button>
        <button id="btnTabular" type="button" class="btn-mode active" onclick="switchMode('TABULAR')">
          Tabular List (คู่มือตามเล่ม)
        </button>
      </div>

      <div class="control-panel">
        <input
          type="search"
          id="searchInput"
          placeholder="พิมพ์คำค้นหา ชื่อโรค หรือรหัส เช่น A04.7, A18.0, D46, Leptospirosis..."
          oninput="filterData()"
        />
        <select id="chapterFilter" onchange="filterData()">
          <option value="ALL">ทุกบท (All Chapters)</option>
          <option value="Ch1">Chapter I (A00–B99)</option>
          <option value="Ch2">Chapter II (C00–D48)</option>
          <option value="Ch3">Chapter III (D50–D89)</option>
          <option value="Ch4">Chapter IV (E00–E90)</option>
          <option value="Ch5">Chapter V (F00–F99)</option>
          <option value="Ch6">Chapter VI (G00–G99)</option>
          <option value="Ch7">Chapter VII (H00–H59)</option>
          <option value="Ch8">Chapter VIII (H60–H95)</option>
          <option value="Ch9">Chapter IX (I00–I99)</option>
          <option value="Ch10">Chapter X (J00–J99)</option>
          <option value="Ch11">Chapter XI (K00–K93)</option>
          <option value="Ch12">Chapter XII (L00–L99)</option>
          <option value="Ch13">Chapter XIII (M00–M99)</option>
          <option value="Ch14">Chapter XIV (N00–N99)</option>
          <option value="Ch15">Chapter XV (O00–O99)</option>
          <option value="Ch16">Chapter XVI (P00–P96)</option>
          <option value="Ch17">Chapter XVII (Q00–Q99)</option>
          <option value="Ch18">Chapter XVIII (R00–R99)</option>
          <option value="Ch19">Chapter XIX (S00–T98)</option>
          <option value="Ch20">Chapter XX (V01–Y98)</option>
          <option value="Ch21">Chapter XXI (Z00–Z99)</option>
          <option value="Ch22">Chapter XXII (U00–U99)</option>
        </select>
        <button type="button" class="btn-reset" onclick="resetFilters()">ล้างค่า</button>
      </div>

      <div id="results"></div>
    </div>
  </div>

  <div id="toast" class="toast">คัดลอกรหัสแล้ว</div>

  <script>
    window.addEventListener('error', function (event) {
      const resultsEl = document.getElementById('results');
      const statusEl = document.getElementById('statusText');
      if (statusEl) statusEl.textContent = 'เกิดข้อผิดพลาด';
      if (resultsEl) {
        resultsEl.innerHTML = `<div class="error-box"><strong>พบข้อผิดพลาดของสคริปต์:</strong> ${escapeHtml(event.message || 'Unknown error')}</div>`;
      }
    });

    let vol3Data = [];

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        el.style.display = 'none';
      }, 1700);
    }

    function copyCode(code) {
      const clean = String(code || '').replace(/[†*]/g, '').trim();
      if (!clean) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(clean).catch(() => {});
      }
      showToast(`คัดลอกรหัส ${clean} แล้ว`);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnVol3').classList.toggle('active', mode === 'VOL3');
      document.getElementById('btnTabular').classList.toggle('active', mode === 'TABULAR');

      if (mode === 'VOL3' && !vol3Loaded) {
        loadVol3Data();
      } else {
        filterData();
      }
    }

    async function loadVol3Data() {
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = 'กำลังโหลดคลัง Vol. 3...';

      const candidateUrls = [
        './icd10_vol3_index.json',
        './data/icd10_vol3_index.json',
        './vol3_index.json'
      ];

      for (const url of candidateUrls) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const json = await res.json();
            vol3Data = Array.isArray(json) ? json : (json.items || json.data || []);
            vol3Loaded = true;
            statusEl.textContent = `Vol. 3 พร้อมใช้งาน (${vol3Data.length.toLocaleString()} รายการ)`;
            filterData();
            return;
          }
        } catch (e) {
          // ลอง path ถัดไป
        }
      }

      vol3Data = sampleTabular.map((item) => ({
        code: item.code,
        term: item.title,
        subterm: item.sub || '',
        chapter: item.category
      }));
      vol3Loaded = true;
      statusEl.textContent = `Vol. 3 โหมดสำรอง (${vol3Data.length} รายการ)`;
      filterData();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('chapterFilter').value = 'ALL';
      filterData();
    }

    function filterData() {
      try {
        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        const ch = document.getElementById('chapterFilter').value;
        const resultsEl = document.getElementById('results');
        const statusEl = document.getElementById('statusText');

        if (currentMode === 'TABULAR') {
          const filtered = sampleTabular.filter((item) => {
            const matchCh = (ch === 'ALL') || (item.category === ch);
            if (!matchCh) return false;
            if (!q) return true;
            const hay = `${item.code} ${item.title} ${item.sub || ''} ${item.note || ''}`.toLowerCase();
            return hay.includes(q);
          });

          statusEl.textContent = `Tabular: แสดง ${filtered.length} รายการ`;

          if (!filtered.length) {
            resultsEl.innerHTML = `<div class="note-box">ไม่พบรายการที่ตรงกับคำค้นหา "${escapeHtml(q)}"</div>`;
            return;
          }

          resultsEl.innerHTML = filtered.map((item) => {
            const btnClass = item.isHeader ? 'code-btn' : 'code-btn sub';
            return `
              <div class="row-item ${item.isHeader ? 'is-header' : ''}">
                <div>
                  <button type="button" class="${btnClass}" onclick="copyCode('${escapeHtml(item.code)}')" title="คลิกเพื่อคัดลอกรหัส">
                    ${escapeHtml(item.code)}
                  </button>
                </div>
                <div>
                  <div class="term-title">${escapeHtml(item.title)}</div>
                  ${item.sub ? `<div class="term-sub">${escapeHtml(item.sub)}</div>` : ''}
                  ${item.note ? `<div class="note-box">${escapeHtml(item.note)}</div>` : ''}
                  ${item.tag ? `<div class="flag-tag">${escapeHtml(item.tag)}</div>` : ''}
                </div>
              </div>
            `;
          }).join('');
        } else {
          const filtered = vol3Data.filter((item) => {
            const itemCh = item.chapter || item.category || 'Ch1';
            const matchCh = (ch === 'ALL') || (itemCh === ch);
            if (!matchCh) return false;
            if (!q) return true;
            const hay = `${item.code || ''} ${item.term || item.title || ''} ${item.subterm || item.sub || ''}`.toLowerCase();
            return hay.includes(q);
          });

          const capped = filtered.slice(0, 250);
          statusEl.textContent = `Vol. 3: พบ ${filtered.length.toLocaleString()} รายการ (แสดง ${capped.length})`;

          if (!capped.length) {
            resultsEl.innerHTML = `<div class="note-box">ไม่พบดัชนี Vol. 3 ที่ตรงกับ "${escapeHtml(q)}"</div>`;
            return;
          }

          resultsEl.innerHTML = capped.map((item) => {
            const code = item.code || '';
            const title = item.term || item.title || '';
            const sub = item.subterm || item.sub || '';
            return `
              <div class="row-item">
                <div>
                  <button type="button" class="code-btn sub" onclick="copyCode('${escapeHtml(code)}')" title="คลิกเพื่อคัดลอกรหัส">
                    ${escapeHtml(code || '—')}
                  </button>
                </div>
                <div>
                  <div class="term-title">${escapeHtml(title)}</div>
                  ${sub ? `<div class="term-sub">${escapeHtml(sub)}</div>` : ''}
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        const resultsEl = document.getElementById('results');
        if (resultsEl) {
          resultsEl.innerHTML = `<div class="error-box">เกิดข้อผิดพลาดระหว่างการแสดงผล: ${escapeHtml(err.message)}</div>`;
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', filterData);
    } else {
      filterData();
    }
  </script>
